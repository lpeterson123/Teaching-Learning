<style>
*{box-sizing:border-box;margin:0;padding:0}
.hdr{padding:.875rem 0 .75rem;border-bottom:.5px solid var(--color-border-tertiary);margin-bottom:.75rem}

.pgtitle{font-size:18px;font-weight:500;color:var(--color-text-primary)}

.leg{display:flex;flex-wrap:wrap;gap:8px;padding:.6rem 0 0;align-items:center}
.li{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.ld{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leaflet-popup-content-wrapper{border-radius:10px!important;border:.5px solid #ccc;box-shadow:0 2px 8px rgba(0,0,0,.12)!important;padding:0!important}
.leaflet-popup-content{margin:0!important}
.pu{padding:11px 12px;width:250px}
.putitle{font-size:13px;font-weight:500;color:#1a1a1a;line-height:1.3;margin-bottom:2px}
.puaddr{font-size:10px;color:#aaa;margin-bottom:8px}
.pubadge{font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:500;padding:2px 7px;border-radius:4px;display:inline-block;margin-bottom:6px}

const map=L.map('map-c',{center:[38.89,-77.04],zoom:11});
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; Carto',maxZoom:19}).addTo(map);

function mkIcon(depts){
  if(depts.length===1){
    const h=D[depts[0]].h;
    return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="22" height="30" viewBox="0 0 22 30"><path d="M11 0C4.925 0 0 4.925 0 11c0 7.333 11 19 11 19S22 18.333 22 11C22 4.925 17.075 0 11 0z" fill="${h}"/><circle cx="11" cy="11" r="4.5" fill="white" opacity=".9"/></svg>`,iconSize:[22,30],iconAnchor:[11,30],popupAnchor:[0,-32],className:''});
  }
  return L.divIcon({html:`<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26"><circle cx="13" cy="13" r="11" fill="white" stroke="#2C2C2A" stroke-width="2.5"/><text x="13" y="17.5" font-size="13" font-family="sans-serif" font-weight="700" text-anchor="middle" fill="#2C2C2A">+</text></svg>`,iconSize:[26,26],iconAnchor:[13,13],popupAnchor:[0,-15],className:''});
}

function mkPopup(loc,idx){
  const multi=loc.d.length>1;
  if(!multi){
    const dept=D[loc.d[0]];
    return`<div class="pu"><span class="pubadge" style="background:${dept.bg};color:${dept.dk}">${dept.l}</span><div class="putitle">${loc.n}</div><div class="puaddr">${loc.a}</div><div class="puph">Course & description coming soon.</div></div>`;
  }
  const tabs=loc.d.map((dk,i)=>`<button class="putb${i===0?' act':''}" style="${i===0?`background:${D[dk].h};border-color:${D[dk].h};color:white`:''}" data-dd="${dk}" onclick="swt('${idx}','${dk}',this)">${D[dk].l}</button>`).join('');
  const contents=loc.d.map((dk,i)=>{
    const dept=D[dk];
    return`<div class="putc${i===0?' show':''}" id="tc-${idx}-${dk}"><span class="pubadge" style="background:${dept.bg};color:${dept.dk}">${dept.l}</span><div class="puph">Course & description coming soon.</div></div>`;
  }).join('');
  return`<div class="pu" id="pu-${idx}"><div class="putitle">${loc.n}</div><div class="puaddr">${loc.a}</div><div class="putab-bar" id="tb-${idx}">${tabs}</div>${contents}</div>`;
}

window.swt=function(idx,dk,btn){
  const pu=document.getElementById('pu-'+idx);
  if(!pu)return;
  pu.querySelectorAll('.putc').forEach(t=>t.classList.remove('show'));
  const tb=document.getElementById('tb-'+idx);
  if(tb)tb.querySelectorAll('.putb').forEach(b=>{b.classList.remove('act');b.style.background='white';b.style.borderColor='#ddd';b.style.color='#888';});
  const tc=document.getElementById('tc-'+idx+'-'+dk);
  if(tc)tc.classList.add('show');
  if(btn){btn.classList.add('act');btn.style.background=D[dk].h;btn.style.borderColor=D[dk].h;btn.style.color='white';}
};

let markers=[],activeDept='all',viewMode='map';

function render(dept){
  markers.forEach(m=>map.removeLayer(m));
  markers=[];
  const filtered=dept==='all'?locs:locs.filter(l=>l.d.includes(dept));
  filtered.forEach((loc,i)=>{
    const multi=loc.d.length>1;
    const m=L.marker([loc.lat,loc.lng],{icon:mkIcon(loc.d),zIndexOffset:multi?600:0})
      .bindPopup(mkPopup(loc,i),{maxWidth:275})
      .addTo(map);
    markers.push(m);
  });
  document.getElementById('cnt').textContent=filtered.length+' location'+(filtered.length!==1?'s':'')+' shown';
}

function renderList(dept){
  const filtered=dept==='all'?locs:locs.filter(l=>l.d.includes(dept));
  const html=filtered.map(loc=>{
    const badges=loc.d.map(dk=>`<span class="lbadge" style="background:${D[dk].bg};color:${D[dk].dk}">${D[dk].l}</span>`).join('');
    return`<div class="lc">${badges}<div class="ltitle">${loc.n}</div><div class="laddr">${loc.a}</div></div>`;
  }).join('');
  document.getElementById('list-c').innerHTML='<div class="cg">'+html+'</div>';
  document.getElementById('cnt').textContent=filtered.length+' location'+(filtered.length!==1?'s':'')+' shown';
}

render('all');

document.getElementById('btn-map').addEventListener('click',()=>{
  viewMode='map';
  document.getElementById('btn-map').classList.add('act');
  document.getElementById('btn-list').classList.remove('act');
  document.getElementById('map-c').style.display='block';
  document.getElementById('list-c').style.display='none';
  map.invalidateSize();
  render(activeDept);
});

document.getElementById('btn-list').addEventListener('click',()=>{
  viewMode='list';
  document.getElementById('btn-list').classList.add('act');
  document.getElementById('btn-map').classList.remove('act');
  document.getElementById('map-c').style.display='none';
  document.getElementById('list-c').style.display='block';
  renderList(activeDept);
});

document.querySelectorAll('.chip').forEach(chip=>{
  chip.addEventListener('click',()=>{
    document.querySelectorAll('.chip').forEach(c=>c.classList.remove('act'));
    chip.classList.add('act');
    activeDept=chip.dataset.d;
    if(viewMode==='map')render(activeDept);
    else renderList(activeDept);
  });
});
</script>
